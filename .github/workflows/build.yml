name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download dictionary and OCR/TTS models
        run: |
          python scripts/prepare_dict.py
          python scripts/prepare_ocr_models.py
          python scripts/prepare_tts.py

      - name: Build exe
        run: pyinstaller game_ocr_vocab.spec --noconfirm

      - name: Smoke test
        shell: pwsh
        run: |
          $dir = ".\dist\game_ocr_vocab"
          $exe = Get-ChildItem $dir -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "exe not found"; exit 1 }
          Start-Process $exe.FullName -WorkingDirectory $dir
          Start-Sleep -Seconds 15
          $p = Get-Process | Where-Object { $_.Path -like "*dist\game_ocr_vocab*" }
          if (-not $p) { Write-Error "exe failed to start"; exit 1 }
          if (-not (Test-Path "$dir\data\app.log")) { Write-Error "app.log missing"; exit 1 }
          Stop-Process -Id $p[0].Id -Force
          if (-not (Test-Path "$dir\_internal\piper\espeak-ng-data")) { Write-Error "piper espeak-ng-data missing"; exit 1 }
          if (-not (Test-Path "$dir\_internal\data\tts\en_US-amy-medium.onnx")) { Write-Error "piper voice model missing"; exit 1 }
          Write-Output "smoke test OK"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from game_ocr_vocab import __version__; print(__version__)"
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: Zip portable folder
        shell: pwsh
        run: Compress-Archive -Path ".\dist\game_ocr_vocab\*" -DestinationPath ".\dist\game_ocr_vocab_win64_v${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: game_ocr_vocab_win64_v${{ steps.ver.outputs.version }}
          path: dist/game_ocr_vocab_win64_v${{ steps.ver.outputs.version }}.zip
          retention-days: 14

      - name: Release latest build
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "dist/game_ocr_vocab_win64_v$ver.zip"
          gh release delete latest --yes --cleanup-tag 2>$null
          $notes = "版本 v$ver（自动构建于 commit $env:GITHUB_SHA）`n解压后双击「游戏单词助手.exe」即可使用（Windows 10/11 x64，全离线）。"
          gh release create latest $zip --title "最新构建 v$ver (latest)" --notes $notes --latest

      - name: Release versioned build
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $zip = "dist/game_ocr_vocab_win64_v$ver.zip"
          gh release create $env:GITHUB_REF_NAME $zip --title "v$ver" --notes "正式版本 v$ver（tag: $env:GITHUB_REF_NAME）`n解压后双击「游戏单词助手.exe」即可使用（Windows 10/11 x64，全离线）。" --latest
